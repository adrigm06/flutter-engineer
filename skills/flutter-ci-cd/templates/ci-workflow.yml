# GitHub Actions CI/CD Workflow

Complete, production-ready workflow for Flutter apps.
Copy to `.github/workflows/ci.yml` and adjust Flutter version and thresholds.

```yaml
name: Flutter CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # Cancel duplicate runs on the same branch

env:
  FLUTTER_VERSION: '3.27.4'  # Pin exactly — never use 'latest'
  JAVA_VERSION: '17'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --check .

      - name: Analyze (fatal infos)
        run: flutter analyze --fatal-infos

      - name: Check for secrets in source
        run: |
          ! grep -rn "sk_live\|pk_live\|AIza\|-----BEGIN" lib/ assets/ \
            --include="*.dart" --include="*.yaml" --include="*.json"

      - name: Run tests with coverage
        run: flutter test --coverage --reporter=github

      - name: Enforce coverage gate (≥ 80%)
        uses: VeryGoodOpenSource/very_good_coverage@v2
        with:
          path: coverage/lcov.info
          min_coverage: 80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────────────────────────
  golden_tests:
    name: Golden Tests (Linux)
    runs-on: ubuntu-latest   # Linux for deterministic font rendering
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Run golden tests
        run: flutter test --tags golden --reporter github

  # ──────────────────────────────────────────────────────────────────────────
  build_android:
    name: Build Android Release
    runs-on: ubuntu-latest
    needs: [quality, golden_tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols/ \
            --dart-define=ENV=production \
            --build-number=${{ github.run_number }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify obfuscation applied
        run: ls -la build/symbols/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ github.run_number }}
          path: build/symbols/
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────────────
  build_ios:
    name: Build iOS Release
    runs-on: macos-latest
    needs: [quality, golden_tests]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build iOS (no code signing — local signing only)
        run: |
          flutter build ios --release \
            --no-codesign \
            --obfuscate \
            --split-debug-info=build/symbols/ \
            --dart-define=ENV=production

  # ──────────────────────────────────────────────────────────────────────────
  apk_size_check:
    name: APK Size Regression Check
    runs-on: ubuntu-latest
    needs: build_android
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk-${{ github.run_number }}

      - name: Check size regression (< 5% above baseline)
        run: |
          BASELINE_BYTES=25000000  # 25MB — update for your app
          CURRENT=$(stat -c%s app-release.apk)
          MAX=$((BASELINE_BYTES * 105 / 100))
          echo "Current APK size: $CURRENT bytes"
          echo "Allowed maximum: $MAX bytes (5% above $BASELINE_BYTES)"
          if [ "$CURRENT" -gt "$MAX" ]; then
            echo "❌ APK size regression detected!"
            exit 1
          fi
          echo "✅ APK size within budget"

  # ──────────────────────────────────────────────────────────────────────────
  # E2E: Only runs on merge to main — not on every PR (too slow)
  e2e_tests:
    name: E2E Tests (Patrol)
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: |
            patrol test \
              --target integration_test \
              --dart-define=ENV=test
```
